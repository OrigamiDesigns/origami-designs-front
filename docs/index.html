<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <style>
      html {
	font-family: sans-serif;
      }
      :root {
	--logo-width: 80px;
	--logo-height: var(--logo-width);
      }
      .layout {
	display: grid;
	grid-template-areas:
	  "header header header"
	  "panel . products";
	grid-template-columns: 1fr 0.25fr 5fr;
      }
      .header {
	grid-area: header;
	display: flex;
	justify-content: center;
	align-items: center;
	margin-bottom: 16px;
      }
      .header h1 {
	flex: 1 8 128px;
	display: flex;
	justify-content: start;
      }
      .header h2 {
	flex: 64 1 auto;
	display: flex;
	justify-content: center;
      }
      .header .logo-container {
	flex: 64 1 auto;
	display: flex;
	justify-content: start;
      }
      .logo {
	width: var(--logo-width);
	height: var(--logo-height);
	display: block;
      }
      .panel {
	grid-area: panel;
      }
      .results {
	/* NOTE: page scrolls if there are many items just the way we want it */
	grid-area: products;
	display: flex;
	flex-flow: row wrap;
      }
      .item {
	margin: 8px;
      }
      .item img {
	display: block;
	width: 128px;
      }
    </style>
    <title>Origami Designs</title>
  </head>
